services:
  village:
    build:
      context: .
      dockerfile: Dockerfile.oci
    restart: unless-stopped
    env_file:
      - .env.village
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      village:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      VILLAGE_DOMAIN: ${VILLAGE_DOMAIN:?Set VILLAGE_DOMAIN in .env first}
    volumes:
      - ./oci/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_village_data:/data
      - caddy_village_config:/config
volumes:
  caddy_village_data:
  caddy_village_config:
