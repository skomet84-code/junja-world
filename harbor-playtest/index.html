 const hit=clickable.find(o=>distance(o,{x,y})<o.r);if(hit){if(distance(player,hit)<170){interaction(hit.kind)}else{let tx=hit.x,ty=hit.y+hit.r*.65;if(hit.kind==='fish'){tx=1457;ty=1164}if(hit.kind==='shop'){tx=610;ty=608}if(hit.kind==='home'){tx=1390;ty=645}if(hit.kind==='fountain'){tx=1100;ty=815}if(hit.kind==='market'){tx=1490;ty=1020}moveTo(tx,ty,{type:'action',kind:hit.kind})}return}
 if(x>780&&x<1435&&y>1140&&y<1415){if(distance(player,{x,y})<135)interaction('harvest');else moveTo(x,y,{type:'action',kind:'harvest'});return}
 moveTo(x,y,null)}
cv.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();handleTap(e.clientX,e.clientY)},{passive:false});
let keys={};window.addEventListener('keydown',e=>{if('wasdWASDArrowUpArrowDownArrowLeftArrowRight'.includes(e.key))keys[e.key]=true;if(e.key==='Escape')closeModal()});window.addEventListener('keyup',e=>{delete keys[e.key]});
function update(dt){t+=dt;if(fishPhase==='wait'&&performance.now()>castUntil){fishPhase='bite';castUntil=performance.now()+2200;els.fishTitle.textContent='❗ 입질이 왔어요!';els.fishDesc.textContent='시간 안에 챔질하기를 눌러주세요';els.fishAction.textContent='🐟 지금 챔질하기!';els.gauge.style.display='none';party(1558,1353,10)}
 if(fishPhase==='bite'&&performance.now()>castUntil){fishFailure('물고기가 도망갔어요!');}
 if(fishPhase==='reel'){gaugePos+=dt*gaugeDir*1.36;if(gaugePos>1){gaugePos=1;gaugeDir=-1}if(gaugePos<0){gaugePos=0;gaugeDir=1}els.needle.style.left=`calc(${gaugePos*100}% - 2px)`}
 let kvx=Number(keys.ArrowRight||keys.d||keys.D)-Number(keys.ArrowLeft||keys.a||keys.A),kvy=Number(keys.ArrowDown||keys.s||keys.S)-Number(keys.ArrowUp||keys.w||keys.W);let dest=null;
 if(kvx||kvy){path=[];goal=null;popup=null;dest={x:player.x+kvx*80,y:player.y+kvy*80}}
 else if(path.length){dest=path[0];if(distance(player,dest)<14){path.shift();dest=path[0]||null;if(!dest){goal=null;if(popup){let p=popup;popup=null;if(p.type==='action')interaction(p.kind);if(p.type==='npc')toast('💬 '+p.npc.name+': '+p.npc.text)}}}}
 let vx=0,vy=0;if(dest){const d=distance(player,dest)||1;vx=(dest.x-player.x)/d*210;vy=(dest.y-player.y)/d*210;player.dir=Math.abs(vx)>Math.abs(vy)?(vx>0?1:3):(vy>0?0:2)}
 let friction=1-Math.exp(-dt*12);player.vx+=(vx-player.vx)*friction;player.vy+=(vy-player.vy)*friction;
 let nx=player.x+player.vx*dt,ny=player.y+player.vy*dt;if(walkable(nx,ny)){player.x=nx;player.y=ny}else{player.vx=0;player.vy=0;if(path.length){path.shift();if(!path.length)goal=null}}
 const f=1-Math.exp(-dt*3.3);camera.x+=(player.x-camera.x)*f;camera.y+=(player.y-camera.y)*f;
 camera.x=Math.min(W-CW/(scale*2),Math.max(CW/(scale*2),camera.x));camera.y=Math.min(H-CH/(scale*2),Math.max(CH/(scale*2),camera.y));
}
function frame(now){const dt=Math.min(.038,(now-last)/1000);last=now;update(dt);drawWorld(dt);drawMini();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function drawMini(){const w=mini.width,h=mini.height;mctx.clearRect(0,0,w,h);mctx.fillStyle='#9dd590';mctx.fillRect(0,0,w,h);mctx.fillStyle='#5daeba';mctx.beginPath();mctx.ellipse(12,130,48,34,0,0,7);mctx.ellipse(164,119,40,39,0,0,7);mctx.fill();for(const o of props){mctx.fillStyle=o.type==='fountain'?'#87ceea':'#ab7b57';mctx.fillRect(o.x/W*w-8,o.y/H*h-6,16,12)}mctx.fillStyle='#ffe48f';mctx.strokeStyle='#263e3a';mctx.lineWidth=2;mctx.beginPath();mctx.arc(player.x/W*w,player.y/H*h,5,0,7);mctx.fill();mctx.stroke()}
function closeModal(){els.modal.classList.remove('open');}
function openModal(html){els.panelBody.innerHTML=html;els.modal.classList.add('open')}
document.getElementById('close').onclick=closeModal;els.modal.addEventListener('click',e=>{if(e.target===els.modal)closeModal()});
function openShop(){const cells=outfits.map(o=>{const cur=state[o.type]===o.id;const have=owned.includes(o.id);return `<div class="item"><div class="item-ico">${o.emoji}</div><strong>${o.name}</strong><span>${have?'보유 중':'🪙 '+o.cost.toLocaleString()+' G'}</span><button data-outfit="${o.id}" class="${cur?'equipped':''}">${cur?'✓ 착용 중':have?'입어보기 · 착용':'구매하고 착용'}</button></div>`}).join('');openModal(`<span class="titlebadge">FASHION BOUTIQUE</span><h2>👒 봄날의 옷가게</h2><p>모자와 옷을 바꿔서 새롭게 꾸며보세요. 구매한 옷은 자동 저장돼요.</p><div class="goods">${cells}</div>`);els.panelBody.querySelectorAll('[data-outfit]').forEach(b=>b.onclick=()=>{const o=outfits.find(x=>x.id===b.dataset.outfit);if(!owned.includes(o.id)){if(state.coins<o.cost){toast('🪙 코인이 부족해요');return}state.coins-=o.cost;owned.push(o.id)}state[o.type]=o.id;hud();save();toast('✨ '+o.name+' 착용 완료!');openShop()})}
function openBag(){const fishIcons={'송사리':'🐟','붕어':'🐠','금붕어':'🐡','황금 잉어':'✨','비단 송어':'🐟','은빛 농어':'🐠'};const list=state.collection.slice(-12).reverse();openModal(`<span class="titlebadge">COLLECTION BOOK</span><h2>🎒 나의 수집 가방</h2><p>낚은 물고기와 꾸미기 아이템을 모아보세요. (${state.collection.length}마리)</p><div class="inventory">${list.map(n=>`<div class="slot"><b>${fishIcons[n]||'🐟'}</b>${n}</div>`).join('')||'<div class="slot"><b>🎣</b>첫 물고기를 낚아보세요</div>'}</div><p style="margin-top:20px">🌸 옷: ${outfits.find(o=>o.id===state.coat)?.name||'기본 옷'} · 모자: ${outfits.find(o=>o.id===state.hat)?.name||'없음'}</p>`) }
function guide(){openModal(`<span class="titlebadge">HOW TO PLAY</span><h2>🌊 준자하버 테스트</h2><p style="font-size:14px;line-height:1.9">👆 <b>바닥 한 번 터치</b> → 캐릭터 자동 이동<br>🐟 <b>낚시하기</b> → 부두에 가서 낚싯대 던지기<br>🎣 <b>입질</b> → 챔질 → 초록 영역에서 타이밍 맞추기<br>👒 <b>옷가게</b> → 코인으로 새 옷과 모자 구매<br>🌱 <b>텃밭 터치</b> → 작물 수확하고 코인 얻기<br>🎒 <b>가방</b> → 내가 낚은 물고기 확인<br>💾 진행 상황은 이 브라우저에 자동 저장됩니다.<br><br><b>개발 미리보기:</b> 아직 친구 멀티플레이·서버 저장은 연결되지 않았어요.</p>`) }
function beginFishing(){closeModal();if(distance(player,{x:1465,y:1177})>190){moveTo(1464,1168,{type:'action',kind:'fish'});toast('🎣 부두로 이동하고 있어요');return}
 fishPhase='wait';fishAttempts=0;castMode=true;castUntil=performance.now()+1300+Math.random()*1700;els.fishTitle.textContent='🎣 낚싯대를 던졌어요';els.fishDesc.textContent='물고기가 입질할 때까지 기다려요…';els.fishAction.textContent='찌를 바라보는 중…';els.gauge.style.display='none';els.fishing.classList.add('open');}
function fishFailure(s){els.fishing.classList.remove('open');fishPhase='idle';castMode=false;toast('💨 '+s)}
function fishingAction(){if(fishPhase==='bite'){fishPhase='reel';fishAttempts=0;gaugePos=0;gaugeDir=1;els.fishTitle.textContent='🐟 릴을 감아 올려요!';els.fishDesc.textContent='초록 영역에서 두 번 터치해서 성공하세요';els.fishAction.textContent='✨ 지금 릴 감기';els.gauge.style.display='block';return}if(fishPhase==='reel'){if(gaugePos>.30&&gaugePos<.70){fishAttempts++;party(player.x,player.y-30,9);if(fishAttempts>=2){const names=['송사리','붕어','금붕어','비단 송어','은빛 농어','황금 잉어'];let roll=Math.random();let idx=roll>.982?5:roll>.84?4:roll>.66?3:Math.floor(roll*3);let fish=names[idx],money=[36,55,88,120,185,600][idx];state.fish++;state.collection.push(fish);state.xp+=36;state.coins+=money;hud();save();fishPhase='idle';castMode=false;els.fishing.classList.remove('open');toast(`🐟 ${fish} 획득! +${money}G`);party(player.x,player.y-75,26);if(state.fish===3){state.coins+=300;toast('🎉 의뢰 완료! 보너스 +300G');hud();save()}return}els.fishDesc.textContent='좋아요! 한 번 더 맞춰보세요 ('+fishAttempts+'/2)'}else{fishAttempts=Math.max(0,fishAttempts-1);els.fishDesc.textContent='앗! 초록 영역에서 눌러주세요'}}}
els.fishAction.addEventListener('click',fishingAction);document.getElementById('shopBtn').onclick=openShop;document.getElementById('bagBtn').onclick=openBag;document.getElementById('guideBtn').onclick=guide;document.getElementById('fishBtn').onclick=beginFishing;document.getElementById('mapButton').onclick=()=>toast('🗺️ 작은 지도로 내 위치를 확인할 수 있어요');
setTimeout(()=>{els.welcome.style.opacity=0},5500);window.__JUNJA_TEST__={getState:()=>({player:{...player},coins:state.coins,fish:state.fish,phase:fishPhase,owned:[...owned],outfit:state.coat,hat:state.hat,pathlen:path.length,gauge:gaugePos}),moveTo,beginFishing,openShop};
})();
