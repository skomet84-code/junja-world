<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#101b2d" />
    <meta name="description" content="한국형 판타지 MMORPG 프로젝트 JUNJA WORLD" />
    <title>JUNJA WORLD</title>
  </head>
  <body>
    <main id="app">
      <div id="game-container"></div>

      <section id="auth-layer" class="screen-layer">
        <div class="login-card">
          <div class="crest">準</div>
          <p class="eyebrow">KOREAN FANTASY ONLINE</p>
          <h1>JUNJA WORLD</h1>
          <p class="subtitle">잊힌 왕국의 문이 다시 열린다</p>
          <label>모험가 이름<input id="hero-name" maxlength="10" placeholder="이름을 입력하세요" autocomplete="off" /></label>
          <p class="select-title">직업 선택</p>
          <div class="class-grid">
            <button class="class-card selected" data-class="warrior"><b>⚔</b><span>검객</span><small>단단한 근접 전사</small></button>
            <button class="class-card" data-class="mage"><b>✦</b><span>도사</span><small>강력한 술법가</small></button>
            <button class="class-card" data-class="ranger"><b>➳</b><span>궁사</span><small>민첩한 원거리 공격</small></button>
          </div>
          <button id="enter-game" class="primary-button">초보자 마을 입장</button>
          <div class="login-footer"><span>JUNJA WORLD v0.2.2</span><span>PC · MOBILE</span></div>
        </div>
      </section>

      <section id="game-ui" class="hidden">
        <div class="top-bar">
          <div class="brand"><span class="mini-crest">準</span><span>JUNJA WORLD</span></div>
          <div class="zone"><small>현재 지역</small><strong>백운성 초보자 마을</strong></div>
          <button id="reset-save" title="처음부터 다시 시작">↻</button>
        </div>
        <aside class="status-panel">
          <div class="portrait" id="portrait">⚔</div>
          <div class="identity"><strong id="ui-name">모험가</strong><span id="ui-class">Lv.1 검객</span></div>
          <div class="bar hp"><i id="hp-bar"></i><span id="hp-text">120 / 120</span></div>
          <div class="bar xp"><i id="xp-bar"></i><span id="xp-text">0 / 100</span></div>
          <div class="stats"><span>공격력 <b id="atk-text">24</b></span><span>처치 <b id="kill-text">0</b></span></div>
        </aside>
        <aside class="quest-panel">
          <div class="panel-title"><span>임무</span><small>MAIN</small></div>
          <strong id="quest-title">낯선 마을의 부름</strong>
          <p id="quest-text">촌장 백운에게 말을 걸어보자.</p>
          <div class="quest-progress"><i id="quest-bar"></i></div>
        </aside>
        <div id="interaction-hint" class="interaction-hint hidden"><kbd>E</kbd><span>대화하기</span></div>
        <div id="toast" class="toast hidden"></div>
        <div id="dialogue" class="dialogue hidden">
          <div class="npc-face">翁</div>
          <div><strong>촌장 백운</strong><p id="dialogue-text"></p><small>E 또는 클릭하여 계속</small></div>
        </div>
        <div class="controls-guide"><span><kbd>WASD</kbd> 이동</span><span><kbd>SPACE</kbd> 공격</span><span><kbd>E</kbd> 대화</span></div>
        <div class="mobile-controls">
          <div class="dpad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
          <div class="actions"><button id="mobile-talk">대화</button><button id="mobile-attack">공격</button></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
