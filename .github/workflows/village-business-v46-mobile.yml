name: Junja Village v46 Honors Mobile QA
on:
  push:
    branches:
      - feat/village-business-honors-v46
  pull_request:
    branches:
      - feat/village-customer-loyalty-v45
permissions:
  contents: read
jobs:
  honors-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout immutable code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install phone test browser
        working-directory: life
        run: |
          npm install --ignore-scripts --no-package-lock
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run 390px actual Chromium honors interface and WebGL street
        working-directory: life
        run: node test_business_honors_browser_v46.mjs
      - name: Save UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junja-v46-honors-stats-phone
          path: life/artifacts/v46-achievements-economy-phone.png
          if-no-files-found: ignore
