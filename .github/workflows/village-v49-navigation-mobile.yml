name: Village v49 Clean Navigation Mobile QA
on:
  push:
    branches: [feat/village-v49-navigation-refresh]
  pull_request:
    branches: [feat/village-v48-visual-polish]
permissions:
  contents: read
jobs:
  information-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install deps and Chromium
        working-directory: life
        run: |
          npm install --ignore-scripts --no-package-lock
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate five-tab categories and previous action reachability
        working-directory: life
        run: node test_village_navigation_v49.mjs
      - name: Play actual mobile and desktop menu routes in browser
        working-directory: life
        run: node test_v49_navigation_mobile.mjs
      - name: Preserve phone/desktop screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junja-v49-five-tab-phone-and-pc
          path: |
            life/artifacts/v49-menu-home-*.png
            life/artifacts/v49-clean-dock-*.png
          if-no-files-found: ignore
