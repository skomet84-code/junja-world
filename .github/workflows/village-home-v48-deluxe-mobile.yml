name: Village v48 Deluxe 3D Mobile QA
on:
  push:
    branches: [feat/village-v48-visual-polish]
  pull_request:
    branches: [feat/village-homestead-interiors-v48]
permissions:
  contents: read
jobs:
  deluxe-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install minimal test dependencies
        working-directory: life
        run: |
          npm install --ignore-scripts --no-package-lock
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Retest original v48 house and rare furniture workflow
        working-directory: life
        run: node test_home_mobile_v48.mjs
      - name: Verify premium lighting and orbital controls on small phones
        working-directory: life
        run: node test_home_deluxe_mobile_v48.mjs
      - name: Preserve phone screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junja-v48-deluxe-phone-screens
          path: |
            life/artifacts/v48-deluxe-mobile-*.png
            life/artifacts/v48-homestead-*.png
          if-no-files-found: ignore
