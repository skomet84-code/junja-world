name: Junja Village v45 Customer Loyalty PostgreSQL QA
on:
  push:
    branches:
      - feat/village-customer-loyalty-v45
  pull_request:
    branches:
      - feat/village-resident-demand-v44
permissions:
  contents: read
jobs:
  verified-customers:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: junja_v45_test
          POSTGRES_USER: junja_ci
          POSTGRES_PASSWORD: disposable_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junja_ci -d junja_v45_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: life
        run: npm install --no-package-lock --ignore-scripts
      - name: Real DB three repeat customers, one VIP purchase, ranking and anti-duplication
        working-directory: life
        run: node test_customer_loyalty_postgres_v45.mjs
        env:
          JUNJA_V45_DISPOSABLE_DB: 'true'
          JUNJA_V45_TEST_DATABASE_URL: postgresql://junja_ci:disposable_ci_only@127.0.0.1:5432/junja_v45_test
