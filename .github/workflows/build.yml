name: JUNJA World Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate server modules
        run: node --check server/frontdoor.mjs && node --check server/recovery-boot.mjs && node --check server/world-store.mjs && node --check server/index.mjs
      - name: Typecheck and build
        run: npm run build
