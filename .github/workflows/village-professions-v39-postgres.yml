name: Junja Village v39 Careers PostgreSQL QA
on:
  push:
    branches:
      - feat/village-professions-v39
  pull_request:
    branches:
      - feat/village-player-market-v38

permissions:
  contents: read

jobs:
  career-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: junja_careers_test
          POSTGRES_USER: junja_ci
          POSTGRES_PASSWORD: disposable_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junja_ci -d junja_careers_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: life
        run: npm install --ignore-scripts --no-package-lock
      - name: Verify job earnings, six retries and checkpoint recovery
        working-directory: life
        run: node test_professions_postgres_v39.mjs
        env:
          JUNJA_V39_DISPOSABLE_DB: 'true'
          JUNJA_V39_TEST_DATABASE_URL: postgresql://junja_ci:disposable_ci_only@127.0.0.1:5432/junja_careers_test
