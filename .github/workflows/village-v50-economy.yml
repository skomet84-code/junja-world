name: Village v50 Economy & Navigation Safety
on:
  push:
    branches: [feat/village-v50-economy-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  economy-and-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install village dependencies
        working-directory: life
        run: npm install --ignore-scripts --no-package-lock
      - name: Full regression and syntax validation
        working-directory: life
        run: npm test
      - name: Vercel build validation
        working-directory: life
        run: npm run build
