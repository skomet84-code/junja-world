name: Junja Village v43 Living World Mobile QA
on:
  push:
    branches:
      - feat/village-lively-world-v43
  pull_request:
    branches:
      - feat/village-business-portal-v42
permissions:
  contents: read
jobs:
  living-village:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout immutable branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install isolated test browser
        working-directory: life
        run: |
          npm install --ignore-scripts --no-package-lock
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify NPC village and business street 3D at phone resolution
        working-directory: life
        run: node test_village_browser_v43.mjs
      - name: Save inspection screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: village-v43-living-world
          path: |
            life/artifacts/v43-lively-island-mobile.png
            life/artifacts/v43-tiered-business-street-mobile.png
          if-no-files-found: ignore
