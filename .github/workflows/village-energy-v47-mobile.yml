name: Village v47 Mobile HUD QA
on:
  push:
    branches: [feat/village-energy-ui-v47]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock
        working-directory: life
      - run: npm install --no-save --no-package-lock playwright@1.56.1
        working-directory: life
      - run: npx playwright install --with-deps chromium
        working-directory: life
      - run: node test_energy_mobile_v47.mjs
        working-directory: life
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v47-phone-energy-dock
          path: life/artifacts/v47-energy-mobile-*.png
          if-no-files-found: ignore
