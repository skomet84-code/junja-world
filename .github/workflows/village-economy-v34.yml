name: Junja Village Economy v34 QA
on:
  push:
    branches:
      - feat/village-living-economy-v34
      - feat/village-walkable-estate-v35
      - feat/village-secure-economy-v36
      - feat/village-ledger-recovery-v37
      - feat/village-player-market-v38
      - feat/village-professions-v39
      - feat/village-business-workshops-v40
      - feat/village-walkable-workshops-v41
      - feat/village-business-portal-v42
      - feat/village-lively-world-v43
      - feat/village-resident-demand-v44
      - feat/village-customer-loyalty-v45
      - feat/village-business-honors-v46
  pull_request:
    branches:
      - village-progression-v30
      - feat/village-walkable-estate-v35

permissions:
  contents: read

jobs:
  village-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install declared backend test dependencies
        working-directory: life
        run: npm install --no-package-lock --ignore-scripts
      - name: Existing village and economy regression tests
        working-directory: life
        run: npm test
      - name: Prepare browser-safe Vercel output
        working-directory: life
        run: npm run build
      - name: Install headless Chromium for 3D farm checks
        if: github.ref == 'refs/heads/feat/village-walkable-estate-v35' || github.event.pull_request.head.ref == 'feat/village-walkable-estate-v35'
        working-directory: life
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Walk and harvest view in phone-sized browser
        if: github.ref == 'refs/heads/feat/village-walkable-estate-v35' || github.event.pull_request.head.ref == 'feat/village-walkable-estate-v35'
        working-directory: life
        run: node test_estate_browser_v35.mjs
      - name: Save 3D farm screenshot for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: village-v35-farm-mobile
          path: life/artifacts/v35-walkable-farm-mobile.png
          if-no-files-found: ignore
