name: Junja Village Economy v34 QA
on:
  push:
    branches:
      - feat/village-living-economy-v34
      - feat/village-walkable-estate-v35
  pull_request:
    branches:
      - village-progression-v30

permissions:
  contents: read

jobs:
  village-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Existing village and economy regression tests
        working-directory: life
        run: npm test
      - name: Prepare browser-safe Vercel output
        working-directory: life
        run: npm run build
