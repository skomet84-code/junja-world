name: Junja Village v45 Customer Street Mobile QA
on:
  push:
    branches:
      - feat/village-customer-loyalty-v45
  pull_request:
    branches:
      - feat/village-resident-demand-v44
permissions:
  contents: read
jobs:
  vip-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install browser tools
        working-directory: life
        run: |
          npm install --ignore-scripts --no-package-lock
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render 3D shop customers and VIP board on phone viewport
        working-directory: life
        run: node test_customer_browser_v45.mjs
      - name: Save phone screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: village-v45-vip-mobile-screenshots
          path: |
            life/artifacts/v45-business-customers-mobile.png
            life/artifacts/v45-vip-board-mobile.png
          if-no-files-found: ignore
