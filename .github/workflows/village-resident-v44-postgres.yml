name: Junja Village v44 NPC Demand PostgreSQL QA
on:
  push:
    branches:
      - feat/village-resident-demand-v44
  pull_request:
    branches:
      - feat/village-lively-world-v43
permissions:
  contents: read
jobs:
  resident-demand:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: junja_v44_test
          POSTGRES_USER: junja_ci
          POSTGRES_PASSWORD: disposable_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junja_ci -d junja_v44_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout v44 change
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked business dependencies
        working-directory: life
        run: npm install --no-package-lock --ignore-scripts
      - name: Real Postgres NPC purchases and tampering proof
        working-directory: life
        run: node test_resident_postgres_v44.mjs
        env:
          JUNJA_V44_DISPOSABLE_DB: 'true'
          JUNJA_V44_TEST_DATABASE_URL: postgresql://junja_ci:disposable_ci_only@127.0.0.1:5432/junja_v44_test
